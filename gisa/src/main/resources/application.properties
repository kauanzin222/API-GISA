spring.application.name=gisa

spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# A sessão do banco fecha ao fim de cada service; o mapeamento para DTO acontece dentro das transações
spring.jpa.open-in-view=false

# Equivale a @BatchSize(size = 50) em todas as entidades e coleções: ao percorrer uma lista,
# os relacionamentos são carregados em lotes (um select com IN) em vez de um select por item (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Dias, depois do dia da terapia, em que ainda dá para registrar presença, falta ou desfazer a
# marcação (1 = até o fim do dia seguinte). Falta justificada é aceita a qualquer momento
gisa.terapia.prazo-presenca-dias=${PRAZO_PRESENCA_DIAS:1}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Origens do front liberadas no CORS, separadas por vírgula (ex.: CORS_ORIGINS=https://gisa.exemplo.com,http://localhost:4200)
# Padrão: front local + front publicado no GitHub Pages (a origem não inclui o caminho /GISA_Front)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://eduardofproenca.github.io}

# E-mail: API do Brevo (BREVO_API_KEY) ou SMTP (SMTP_HOST). Sem nenhum dos dois (ex.: desenvolvimento
# local), o conteúdo dos e-mails vai para o log
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Brevo (API HTTP, recomendada no Render gratuito, que bloqueia SMTP): tem prioridade sobre o SMTP
gisa.email.brevo-api-key=${BREVO_API_KEY:}
gisa.email.remetente=${EMAIL_REMETENTE:nao-responda@gisa.local}
gisa.email.remetente-nome=${EMAIL_REMETENTE_NOME:GISA}
# Endereço do front, usado nos links enviados por e-mail (ex.: ${FRONT_URL}/redefinir-senha?token=...)
gisa.front-url=${FRONT_URL:http://localhost:4200}
